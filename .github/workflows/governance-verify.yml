name: governance

# The authoritative layer. Local hooks are advisory and bypassable with
# `--no-verify`; these four checks are what a Ruleset marks as required, and
# nothing a developer can do inside the PR changes their outcome.
#
# Ordering is part of the design: lint, semgrep and the agent all consume content
# from .governance/, so they only run AFTER integrity has proved that content is
# the registry's. Verifying rules with rules the PR could have edited is theatre.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  integrity:
    name: governance-integrity
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false matters. By default checkout writes
      #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
      # into the repo's git config, which applies to EVERY github.com URL and
      # takes precedence over the registry credentials below — so govctl's clone
      # of the registry is attempted with a token scoped to this repo only, and
      # fails with a bare "git ls-remote failed".
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://npm.pkg.github.com' }}
          # Without `scope`, setup-node makes this the DEFAULT registry and every
          # public dependency (commander, zod, ...) is looked up there too, and 404s.
          scope: ${{ vars.NPM_SCOPE || '@shashiladev-heshan' }}

      # Installed from the private registry, never from the PR's node_modules or
      # a script in the repo — the verifier must not be code the PR can change.
      - name: Install govctl
        run: npm install -g @shashiladev-heshan/govctl@${{ vars.GOVCTL_VERSION || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # govctl clones the registry over https. For a private registry repo this
      # is what authenticates the clone, without putting a token in governance.json.
      # (`secrets` is not available in step-level `if`, hence the shell guard.)
      - name: Authenticate git to the registry
        run: |
          if [ -n "${TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
        env:
          TOKEN: ${{ secrets.GOVERNANCE_REPO_TOKEN }}

      # The trust root comes from org configuration, not the repository.
      - name: Configure trust root
        run: |
          mkdir -p "$RUNNER_TEMP/govctl"
          printf '%s' "$TRUST_ROOT" > "$RUNNER_TEMP/govctl/trust.json"
          echo "GOVCTL_TRUST_ROOT=$RUNNER_TEMP/govctl/trust.json" >> "$GITHUB_ENV"
        env:
          TRUST_ROOT: ${{ vars.GOVERNANCE_TRUST_ROOT }}

      # --remote re-fetches the canonical manifest from the registry and ignores
      # the copy in the PR, so editing a governed file AND its manifest entry
      # still fails. --strict makes an unverifiable signature fatal.
      - name: Verify governance integrity
        run: govctl verify --remote --strict

  semgrep:
    name: governance-patterns
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install semgrep

      # Rules come from .governance/, which the integrity job has just proved
      # matches the registry byte for byte.
      - name: Run governance pattern rules
        run: |
          semgrep scan \
            --config .governance/policies/semgrep/ \
            --error \
            --sarif --output semgrep.sarif \
            --metrics=off

      # Requires GitHub Advanced Security on private repos. The semgrep exit code
      # above is the gate — this upload is a convenience, so it never fails the job.
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: governance-patterns

# The semantic (agent) job is omitted while no ANTHROPIC_API_KEY is configured.
# Restore it from project-integration/.github/workflows/governance-verify.yml in
# the governance-platform repo once the secret exists.
